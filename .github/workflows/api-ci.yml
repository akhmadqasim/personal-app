name: API CI

on:
  pull_request:
    paths: ["api/**", ".github/workflows/api-ci.yml"]
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo install worker-build --locked
      - name: Smoke-test wrangler dev on this runner
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          bunx wrangler --version
          bunx wrangler d1 migrations apply DB --local --persist-to .wrangler/ci-smoke </dev/null
          (bunx wrangler dev --port 8799 --ip 127.0.0.1 --var API_TOKEN:ci --persist-to .wrangler/ci-smoke --log-level info </dev/null > wrangler-smoke.log 2>&1 &)
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8799/api/health; then echo; echo "healthy after ${i}x2s"; break; fi
            sleep 2
            if [ "$i" = 120 ]; then echo "wrangler dev never became healthy"; cat wrangler-smoke.log; exit 1; fi
          done
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer ci" -X POST -H "content-type: application/json" -d '{"since_seq":0}' http://127.0.0.1:8799/api/sync
          pkill -9 -f "wrangler dev" || true; pkill -9 -f workerd || true
          tail -50 wrangler-smoke.log
      - name: Run integration tests
        timeout-minutes: 22
        # No pipeline: `tee`/`tail` keep the step's stdout pipe open for as long as any
        # grandchild holds it, which made a leaked `wrangler dev` unkillable. The log is
        # printed by the next step instead.
        run: timeout 20m cargo test --test api -- --nocapture > api-test.log 2>&1
      - name: Tail integration test log
        if: always()
        run: tail -300 api-test.log
      - name: Upload API CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-ci-logs
          path: |
            api/api-test.log
            api/wrangler-smoke.log
            api/.wrangler/test-state/wrangler-dev.log
