name: iOS CI

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # The macos-26 image ships Xcode 26 without the iOS simulator runtime, so
      # every destination lookup fails until the platform is downloaded.
      - name: Install the iOS simulator platform
        timeout-minutes: 20
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Personal.xcodeproj -scheme Personal

      # Runtimes only appear once the platform above is installed, so this must
      # stay after that step.
      - name: Pick an available iPhone simulator
        run: |
          set -euo pipefail
          SIM_INFO=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys

          devices = json.load(sys.stdin)["devices"]

          def iphones(runtime):
              return [
                  d["name"]
                  for d in devices[runtime]
                  if d.get("isAvailable") and d["name"].startswith("iPhone")
              ]

          preferred = [r for r in devices if "iOS-26" in r]
          rest = [r for r in devices if r not in preferred]
          for runtime in sorted(preferred, reverse=True) + rest:
              names = iphones(runtime)
              if names:
                  print("%s|%s" % (names[0], runtime))
                  break
          ')
          if [ -z "$SIM_INFO" ]; then
            echo "No available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi
          SIM_NAME=${SIM_INFO%%|*}
          SIM_RUNTIME=${SIM_INFO#*|}
          echo "Using simulator: $SIM_NAME (runtime $SIM_RUNTIME)"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test -project Personal.xcodeproj -scheme Personal \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | tail -50

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
