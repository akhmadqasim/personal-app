name: iOS CI

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # The macos-26 image ships Xcode 26 without the iOS simulator runtime, so
      # every destination lookup fails until the platform is downloaded. The
      # download talks to Apple's CDN and flakes ("Unable to connect to
      # simulator.", exit 70), hence the retries. No `pipefail` here: `grep -q`
      # exits early and would SIGPIPE `simctl` into a false negative.
      - name: Install the iOS simulator platform
        timeout-minutes: 20
        run: |
          set -u
          if xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "iOS 26 runtime present"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Downloading the iOS simulator platform (attempt $attempt/3)"
            if sudo xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Download failed; retrying in 30 s" >&2
              sleep 30
            fi
          done
          echo "Could not install the iOS simulator platform after 3 attempts" >&2
          xcrun simctl list runtimes >&2
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Personal.xcodeproj -scheme Personal

      # Runtimes only appear once the platform above is installed, so this must
      # stay after that step.
      - name: Pick an available iPhone simulator
        run: |
          set -euo pipefail
          SIM_INFO=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys

          devices = json.load(sys.stdin)["devices"]

          def iphones(runtime):
              return [
                  d["name"]
                  for d in devices[runtime]
                  if d.get("isAvailable") and d["name"].startswith("iPhone")
              ]

          def version(runtime):
              # "com.apple.CoreSimulator.SimRuntime.iOS-26-0" -> "26.0".
              if "iOS-" not in runtime:
                  return ""
              parts = runtime.rsplit("iOS-", 1)[-1].split("-")
              if not parts or not all(p.isdigit() for p in parts):
                  return ""
              return ".".join(parts)

          preferred = [r for r in devices if "iOS-26" in r]
          rest = [r for r in devices if r not in preferred]
          for runtime in sorted(preferred, reverse=True) + rest:
              names = iphones(runtime)
              if names:
                  print("%s|%s|%s" % (names[0], runtime, version(runtime)))
                  break
          ')
          if [ -z "$SIM_INFO" ]; then
            echo "No available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi
          SIM_NAME=$(printf '%s' "$SIM_INFO" | cut -d'|' -f1)
          SIM_RUNTIME=$(printf '%s' "$SIM_INFO" | cut -d'|' -f2)
          SIM_RUNTIME_VERSION=$(printf '%s' "$SIM_INFO" | cut -d'|' -f3)
          echo "Using simulator: $SIM_NAME (runtime $SIM_RUNTIME, OS ${SIM_RUNTIME_VERSION:-unknown})"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"
          echo "SIM_RUNTIME_VERSION=$SIM_RUNTIME_VERSION" >> "$GITHUB_ENV"

      # `name=` alone matches whatever runtime the device happens to be on,
      # which becomes ambiguous the moment the image ships two. Pinning `OS=`
      # keeps the run reproducible; an unparseable runtime identifier falls
      # back to the looser destination rather than failing the job.
      - name: Test
        run: |
          set -euo pipefail
          DESTINATION="platform=iOS Simulator,name=$SIM_NAME"
          if [ -n "${SIM_RUNTIME_VERSION:-}" ]; then
            DESTINATION="$DESTINATION,OS=$SIM_RUNTIME_VERSION"
          fi
          echo "Destination: $DESTINATION"
          xcodebuild test -project Personal.xcodeproj -scheme Personal \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | tail -50

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
