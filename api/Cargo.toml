[package]
name = "personal-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Personal API on Cloudflare Workers (D1 + R2)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
libtest-mimic = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "api"
path = "tests/api/main.rs"
harness = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
